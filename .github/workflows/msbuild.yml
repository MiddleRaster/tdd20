name: MSBuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      working-directory: ${{ github.workspace }}
      shell: cmd
      run: msbuild /restore /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 /p:PlatformToolset=v143 ${{env.SOLUTION_FILE_PATH}}
